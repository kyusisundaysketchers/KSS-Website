<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee5cd">
<link rel="icon" type="image/png" href="../assets/kss-logo.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kyusi Sunday Sketchers">
<meta property="og:title" content="Gallery · KSS Vol. 8 · Alamat, Likha at Katha">
<meta property="og:description" content="Photos from Kyusi Sunday Sketchers Vol. 8 — Alamat, Likha at Katha, our first anniversary live drawing session at Racket Room Collective, Cubao.">
<meta property="og:locale" content="en_PH">
<meta property="og:image" content="https://kyusisundaysketchers.github.io/KSS-Website/assets/gallery/vol8/drone_0024.jpg">
<meta name="twitter:card" content="summary_large_image">
<title>Gallery · Kyusi Sunday Sketchers</title>
<meta name="description" content="Photos from Kyusi Sunday Sketchers Vol. 8 — Alamat, Likha at Katha (4 October 2026, Racket Room Collective, Cubao).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eee5cd;
  --paper-2:#e5d9b8;
  --ink:#22302f;
  --muted:#6e7264;
  --line:rgba(34,48,47,.16);
  --accent:#d1512a;
  --max:1180px;
  --display:"Instrument Serif", Georgia, serif;
  --sans:"DM Sans", Arial, sans-serif;
  --row:230px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.container{width:min(var(--max),calc(100% - 48px));margin:auto}
.label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* Header (same as the home page, simplified) */
.header{position:sticky;top:0;z-index:50;background:rgba(238,229,205,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:28px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:72px;height:72px;object-fit:contain;mix-blend-mode:multiply}
.brand-text{font-family:var(--display);font-size:24px;line-height:.9}
.back{font-size:13px;color:#4a5754;padding:12px 0}
.back:hover{color:var(--ink);text-decoration:underline;text-underline-offset:5px}

/* Intro */
.intro{padding:64px 0 28px}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,7vw,92px);line-height:.92;margin:10px 0 18px}
.intro h1 em{color:var(--accent)}
.intro p{max-width:620px;margin:0;color:#4a5754;font-size:15px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}

/* Volume tabs + section filters */
.controls{position:sticky;top:84px;z-index:40;background:rgba(238,229,205,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.controls .container{display:flex;flex-direction:column;gap:10px;padding:12px 0}
.vols,.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.vols[hidden]{display:none}
.vols::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.vol{border:0;background:none;padding:4px 0;margin-right:14px;font-family:var(--display);font-size:22px;color:var(--muted);cursor:pointer;white-space:nowrap}
.vol[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dot,var(--muted))}
.chip small{opacity:.6;font-size:11px}

/* Sections + justified rows (order stays left-to-right) */
.galleries{padding:30px 0 80px}
.gsec{padding:30px 0 10px;scroll-margin-top:190px}
.gsec[hidden]{display:none}
.gsec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.gsec-head h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,3.6vw,44px);margin:0;line-height:1}
.gsec-head .bar{width:28px;height:3px;border-radius:2px;background:var(--dot,var(--accent));transform:translateY(-8px)}
.gsec-head .label{margin-left:auto}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.grid:after{content:"";flex-grow:999999}
.ph{position:relative;display:block;padding:0;border:0;background:var(--paper-2);border-radius:4px;overflow:hidden;cursor:zoom-in;flex-shrink:1}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease,opacity .4s}
.ph img.loading{opacity:0}
.ph:hover img{transform:scale(1.03)}
.ph:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(18,22,21,.96);display:none;color:#eee5cd;touch-action:pan-y}
.lb.open{display:block}
.lb figure{position:absolute;inset:56px 64px 64px;margin:0;display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:2px;box-shadow:0 20px 60px rgba(0,0,0,.4);user-select:none;-webkit-user-drag:none}
.lb-top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;letter-spacing:.08em}
.lb-top .where{opacity:.75}
.lb button{border:0;background:rgba(238,229,205,.08);color:#eee5cd;border-radius:999px;cursor:pointer;transition:background .15s}
.lb button:hover{background:rgba(238,229,205,.18)}
.lb-close{width:40px;height:40px;font-size:20px;line-height:1}
.lb-nav{position:absolute;top:50%;width:48px;height:48px;margin-top:-24px;font-size:20px}
.lb-prev{left:10px}.lb-next{right:10px}
.lb-cap{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;opacity:.85}

.footer{border-top:1px solid var(--line);padding:34px 0 48px}
.footer-grid{display:flex;justify-content:space-between;gap:30px;align-items:end;flex-wrap:wrap}
.footer-brand{font-family:var(--display);font-size:24px}
.footer small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
.footer-links{display:flex;gap:24px;font-size:12px}

@media (max-width:760px){
  :root{--row:150px}
  .container{width:calc(100% - 32px)}
  .nav{min-height:68px}
  .brand img{width:52px;height:52px}
  .brand-text{font-size:19px}
  .controls{top:68px}
  .intro{padding:40px 0 20px}
  .grid{gap:5px}
  .lb figure{inset:56px 0 64px}
  .lb-nav{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<header class="header">
  <div class="container nav">
    <a class="brand" href="../">
      <img src="../assets/kss-logo.png" alt="Kyusi Sunday Sketchers logo">
      <span class="brand-text">Kyusi Sunday<br>Sketchers</span>
    </a>
    <a class="back" href="../">← Back to home</a>
  </div>
</header>

<main>
  <section class="intro">
    <div class="container">
      <div class="label">Gallery</div>
      <h1 id="volTitle">Alamat, Likha <em>at</em> Katha</h1>
      <p id="volBlurb"></p>
      <div class="meta" id="volMeta"></div>
    </div>
  </section>

  <div class="controls">
    <div class="container">
      <div class="vols" id="vols" role="group" aria-label="Volume"></div>
      <div class="chips" id="chips" role="group" aria-label="Filter by section"></div>
    </div>
  </div>

  <div class="container galleries" id="galleries" aria-live="polite"></div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
  <div class="lb-top">
    <span class="where" id="lbWhere"></span>
    <button type="button" class="lb-close" id="lbClose" aria-label="Close">×</button>
  </div>
  <figure><img id="lbImg" alt=""></figure>
  <button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="Previous photo">←</button>
  <button type="button" class="lb-nav lb-next" id="lbNext" aria-label="Next photo">→</button>
  <div class="lb-cap" id="lbCap"></div>
</div>

<footer class="footer">
  <div class="container footer-grid">
    <div><div class="footer-brand">Kyusi Sunday Sketchers</div><small>Quezon City</small></div>
    <div class="footer-links">
      <a href="https://www.instagram.com/kyusisundaysketchers/" target="_blank" rel="noopener">Instagram</a>
      <a href="../#archive">The Archive</a>
      <a href="../#about">About KSS</a>
    </div>
  </div>
</footer>

<script>
/* One entry per volume. To add a volume: export its photos into assets/gallery/<id>/ with a photos.json
   ({sections:[{id,title}], photos:[{id,s,w,h}]}, each photo as <id>.jpg + <id>-t.jpg) and add it here, newest first. */
const VOLUMES = [
  {
    id: "vol8", tab: "Vol. 8",
    title: "Alamat, Likha <em>at</em> Katha",
    blurb: "Our first anniversary: a themed live drawing session with three stations drawn from Philippine myth — Lakapati, Sitan and Bathala — and a room full of sketchers. Thank you to everyone who drew with us.",
    meta: ["<b>4 October 2026</b>", "Racket Room Collective, Cubao", "Kyusi Sunday Sketchers · Vol. 8 · First Anniversary"],
    colours: { arrival: "#d1512a", lakapati: "#3d7f78", bathala: "#dda31e", sitan: "#8f3049", sketchers: "#6e7264", finale: "#22302f" }
  }
];

const $ = id => document.getElementById(id);
let vol, data, filter = "all", view = [], cur = -1, lastFocus = null;

function base(v) { return `../assets/gallery/${v.id}/`; }

async function loadVolume(v) {
  vol = v; filter = "all";
  $("volTitle").innerHTML = v.title;
  $("volBlurb").textContent = v.blurb;
  $("volMeta").innerHTML = v.meta.map(m => `<span>${m}</span>`).join("");
  $("vols").hidden = VOLUMES.length < 2;   // the volume tabs appear once a second volume is added
  $("vols").innerHTML = VOLUMES.map(x => `<button type="button" class="vol" data-vol="${x.id}" aria-pressed="${x === v}">${x.tab}</button>`).join("");
  // "no-cache" checks with the server every visit (a quick 304 when nothing changed), so added or
  // removed photos show up right after a deploy instead of after the ~10 min GitHub Pages cache
  data = await fetch(base(v) + "photos.json", { cache: "no-cache" }).then(r => r.json());
  const count = s => data.photos.filter(p => p.s === s).length;
  $("chips").innerHTML =
    `<button type="button" class="chip" data-f="all" aria-pressed="true">All <small>${data.photos.length}</small></button>` +
    data.sections.filter(s => count(s.id)).map(s =>
      `<button type="button" class="chip" data-f="${s.id}" aria-pressed="false" style="--dot:${v.colours[s.id] || "var(--muted)"}"><i></i>${s.title} <small>${count(s.id)}</small></button>`).join("");
  $("galleries").innerHTML = data.sections.filter(s => count(s.id)).map(s => `
    <section class="gsec" id="s-${s.id}" data-s="${s.id}" style="--dot:${v.colours[s.id] || "var(--accent)"}">
      <div class="gsec-head"><span class="bar"></span><h2>${s.title}</h2><span class="label">${count(s.id)} photos</span></div>
      <div class="grid">${data.photos.filter(p => p.s === s.id).map(p => {
        const r = p.w / p.h;
        return `<button type="button" class="ph" data-id="${p.id}" style="flex-grow:${r.toFixed(3)};flex-basis:calc(var(--row) * ${r.toFixed(3)});aspect-ratio:${p.w}/${p.h}" aria-label="Open photo: ${s.title.replace(/"/g, "")}">
          <img class="loading" src="${base(v)}${p.id}-t.jpg" width="${p.w}" height="${p.h}" alt="${s.title.replace(/"/g, "")}, KSS ${v.tab}" loading="lazy" decoding="async" onload="this.classList.remove('loading')"></button>`;
      }).join("")}</div>
    </section>`).join("");
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.f === filter));
  document.querySelectorAll(".gsec").forEach(s => s.hidden = filter !== "all" && s.dataset.s !== filter);
  view = data.photos.filter(p => filter === "all" || p.s === filter);
}

/* Lightbox */
const sectionTitle = id => data.sections.find(s => s.id === id).title;
function show(i) {
  cur = (i + view.length) % view.length;
  const p = view[cur], img = $("lbImg");
  img.src = base(vol) + p.id + ".jpg";
  img.alt = `${sectionTitle(p.s)}, KSS ${vol.tab}`;
  $("lbCap").textContent = sectionTitle(p.s);
  $("lbWhere").textContent = `${cur + 1} / ${view.length}`;
  [cur + 1, cur - 1].forEach(j => { const n = view[(j + view.length) % view.length]; new Image().src = base(vol) + n.id + ".jpg"; });
}
function openLb(id) {
  lastFocus = document.activeElement;
  $("lb").classList.add("open"); $("lb").setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  show(view.findIndex(p => p.id === id));
  $("lbClose").focus();
}
function close() {
  $("lb").classList.remove("open"); $("lb").setAttribute("aria-hidden", "true");
  document.body.style.overflow = ""; $("lbImg").removeAttribute("src");
  if (lastFocus) lastFocus.focus();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.vol && t.dataset.vol !== vol.id) loadVolume(VOLUMES.find(v => v.id === t.dataset.vol));
  else if (t.dataset.f) {
    filter = t.dataset.f; applyFilter();
    t.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    const top = (filter === "all" ? $("galleries") : $("s-" + filter)).getBoundingClientRect().top + scrollY;
    window.scrollTo({ top: top - document.querySelector(".controls").getBoundingClientRect().bottom + 10, behavior: "smooth" });
  }
  else if (t.classList.contains("ph")) openLb(t.dataset.id);
});
$("lbClose").onclick = close;
$("lbPrev").onclick = () => show(cur - 1);
$("lbNext").onclick = () => show(cur + 1);
$("lb").addEventListener("click", e => { if (e.target === $("lb") || e.target.tagName === "FIGURE") close(); });
document.addEventListener("keydown", e => {
  if (!$("lb").classList.contains("open")) return;
  if (e.key === "Escape") close();
  else if (e.key === "ArrowRight") show(cur + 1);
  else if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === "Tab") {  // keep focus inside the viewer
    const f = [$("lbClose"), $("lbPrev"), $("lbNext")].filter(b => b.offsetParent);
    const i = f.indexOf(document.activeElement);
    e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
});
let x0 = null;
$("lb").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
$("lb").addEventListener("touchend", e => {
  if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
});

loadVolume(VOLUMES[0]);
</script>
</body>
</html>
